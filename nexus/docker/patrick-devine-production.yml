version: '3.8'

services:
  # Patrick Devine Production Server
  patrick-devine-server:
    image: patrick-devine:latest
    container_name: patrick-devine-production
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PATRICK_DEVINE_MODE=24_7
      - COUCHDB_URL=http://patrick-devine-db:5984
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - COUCHDB_DATABASE=patrick_devine_production
    volumes:
      - patrick-devine-data:/app/data
      - patrick-devine-logs:/app/logs
    restart: unless-stopped
    depends_on:
      - patrick-devine-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - patrick-devine-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # CouchDB Database
  patrick-devine-db:
    image: couchdb:3.3
    container_name: patrick-devine-couchdb
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - COUCHDB_SINGLE_NODE=true
      - COUCHDB_UUID=patrick-devine-production
    volumes:
      - couchdb-data:/opt/couchdb/data
      - couchdb-config:/opt/couchdb/etc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - patrick-devine-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Prometheus Monitoring
  patrick-devine-prometheus:
    image: prom/prometheus:latest
    container_name: patrick-devine-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - patrick-devine-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Grafana Dashboard
  patrick-devine-grafana:
    image: grafana/grafana:latest
    container_name: patrick-devine-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=patrick-devine-admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    depends_on:
      - patrick-devine-prometheus
    networks:
      - patrick-devine-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Alert Manager
  patrick-devine-alertmanager:
    image: prom/alertmanager:latest
    container_name: patrick-devine-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - patrick-devine-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Nginx Reverse Proxy
  patrick-devine-nginx:
    image: nginx:alpine
    container_name: patrick-devine-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - patrick-devine-server
    networks:
      - patrick-devine-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Backup Service
  patrick-devine-backup:
    image: patrick-devine-backup:latest
    container_name: patrick-devine-backup
    environment:
      - COUCHDB_URL=http://patrick-devine-db:5984
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - BACKUP_SCHEDULE=0 2 * * *
      - S3_BUCKET=patrick-devine-backups
      - S3_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - backup-data:/backup
    restart: unless-stopped
    depends_on:
      - patrick-devine-db
    networks:
      - patrick-devine-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Log Aggregator
  patrick-devine-logs:
    image: fluent/fluent-bit:latest
    container_name: patrick-devine-logs
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - logs-data:/logs
    restart: unless-stopped
    networks:
      - patrick-devine-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Load Balancer (HAProxy)
  patrick-devine-haproxy:
    image: haproxy:latest
    container_name: patrick-devine-haproxy
    ports:
      - "8081:8081"
      - "8404:8404"
    volumes:
      - ./monitoring/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      - patrick-devine-server
    networks:
      - patrick-devine-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

volumes:
  patrick-devine-data:
    driver: local
  patrick-devine-logs:
    driver: local
  couchdb-data:
    driver: local
  couchdb-config:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  nginx-logs:
    driver: local
  backup-data:
    driver: local
  logs-data:
    driver: local

networks:
  patrick-devine-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 