name: Zero Error Release Automation

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ release, main ]

env:
  JAVA_OPTS: "--enable-native-access=ALL-UNNAMED"

jobs:
  zero-error-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        java-version: ['17', '21']
      fail-fast: true
    
    outputs:
      error-count: ${{ steps.error-check.outputs.errors }}
      should-release: ${{ steps.error-check.outputs.should-release }}
      release-version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper
        
    - name: Configure environment
      run: |
        export JAVA_OPTS="--enable-native-access=ALL-UNNAMED"
        echo "JAVA_OPTS=$JAVA_OPTS" >> $GITHUB_ENV
        
    - name: Run comprehensive build and tests
      id: build
      run: |
        cd Trikeshed
        echo "::group::Build with error tracking"
        
        # Build and capture all output
        ./gradlew clean build test --console=plain --no-daemon \
          --continue --info 2>&1 | tee build-output.log
        
        echo "::endgroup::"
        
    - name: Analyze errors and warnings
      id: error-check
      run: |
        cd Trikeshed
        
        # Count compilation errors
        COMPILE_ERRORS=$(grep -c "FAILED\|ERROR\|compilation failed" build-output.log || echo "0")
        
        # Count test failures
        TEST_FAILURES=$(grep -c "FAILED.*test\|Test.*FAILED" build-output.log || echo "0")
        
        # Count warnings (excluding deprecation warnings we accept)
        WARNINGS=$(grep -c "warning:" build-output.log | grep -v "deprecation\|unchecked" || echo "0")
        
        # Total error count
        TOTAL_ERRORS=$((COMPILE_ERRORS + TEST_FAILURES))
        
        echo "Compilation errors: $COMPILE_ERRORS"
        echo "Test failures: $TEST_FAILURES" 
        echo "Warnings: $WARNINGS"
        echo "Total errors: $TOTAL_ERRORS"
        
        echo "errors=$TOTAL_ERRORS" >> $GITHUB_OUTPUT
        
        # Determine if we should create a release (zero errors)
        if [ "$TOTAL_ERRORS" -eq 0 ]; then
          echo "should-release=true" >> $GITHUB_OUTPUT
          echo "✅ ZERO ERRORS - Ready for release!"
        else
          echo "should-release=false" >> $GITHUB_OUTPUT
          echo "❌ $TOTAL_ERRORS errors found - Not ready for release"
        fi
        
    - name: Generate version number
      id: version
      if: steps.error-check.outputs.should-release == 'true'
      run: |
        # Generate semantic version based on date and commit
        VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"
        
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-java-${{ matrix.java-version }}
        path: |
          Trikeshed/build-output.log
          Trikeshed/build/reports/
          Trikeshed/build/test-results/
        retention-days: 7

  create-release-tag:
    runs-on: ubuntu-latest
    needs: zero-error-verification
    if: needs.zero-error-verification.outputs.should-release == 'true' && github.ref == 'refs/heads/dev'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Configure git
      run: |
        git config user.name "Zero Error Release Bot"
        git config user.email "noreply@superbikeshed.dev"
        
    - name: Create and push release tag
      run: |
        VERSION="${{ needs.zero-error-verification.outputs.release-version }}"
        
        # Create annotated tag with build info
        git tag -a "$VERSION" -m "Zero Error Release $VERSION
        
        ✅ All tests passed
        ✅ Zero compilation errors  
        ✅ Zero test failures
        
        Generated by Zero Error Release Automation
        Commit: $(git rev-parse HEAD)
        Date: $(date -u)"
        
        # Push tag
        git push origin "$VERSION"
        
        echo "Created and pushed release tag: $VERSION"
        
    - name: Merge to release branch
      run: |
        # Switch to release branch and merge dev
        git fetch origin
        git checkout release
        git merge origin/dev --no-ff -m "Zero error release merge: ${{ needs.zero-error-verification.outputs.release-version }}"
        git push origin release
        
        echo "Merged dev to release branch"

  notify-release:
    runs-on: ubuntu-latest
    needs: [zero-error-verification, create-release-tag]
    if: needs.zero-error-verification.outputs.should-release == 'true'
    
    steps:
    - name: Release notification
      run: |
        echo "🎉 ZERO ERROR RELEASE CREATED! 🎉"
        echo "Version: ${{ needs.zero-error-verification.outputs.release-version }}"
        echo "Branch: release"
        echo "Status: Ready for production deployment"

  error-report:
    runs-on: ubuntu-latest
    needs: zero-error-verification
    if: needs.zero-error-verification.outputs.should-release == 'false'
    
    steps:
    - name: Error report
      run: |
        echo "❌ Release blocked due to errors"
        echo "Error count: ${{ needs.zero-error-verification.outputs.error-count }}"
        echo "Fix errors on dev branch to enable automatic release"