name: Build TrikeShed Projects

on: [push, pull_request]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
  JAVA_VERSION: '21'

jobs:
  gradle_build:
    name: 🏗️ Build All Projects
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          
      - name: 📋 Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: 🔧 Set up Gradle
        uses: gradle/gradle-build-action@v2

      - name: 🏗️ Build Core Projects
        run: |
          ./gradlew :Trikeshed:build --console=plain --no-daemon
          ./gradlew :ksp-processors:build --console=plain --no-daemon
          ./gradlew :kotlin-entity-scanner:build --console=plain --no-daemon
          
      - name: 🏗️ Build Application Projects  
        run: |
          ./gradlew :k2script:build --console=plain --no-daemon
          ./gradlew :rtsgame:build --console=plain --no-daemon
          ./gradlew :moneyfan:build --console=plain --no-daemon
          ./gradlew :ta4k:build --console=plain --no-daemon
          
      - name: 🏗️ Build Tool Projects
        run: |
          ./gradlew :spacegraph:build --console=plain --no-daemon
          ./gradlew :flatton:build --console=plain --no-daemon
          ./gradlew :nexus:build --console=plain --no-daemon
