name: 🔥 Comprehensive CI Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
  JAVA_VERSION: '21'
  KOTLIN_VERSION: '2.1.21'

jobs:
  # ==============================================================================
  # MULTIPLATFORM BUILD MATRIX
  # ==============================================================================
  build-matrix:
    name: 🏗️ Build Matrix (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [jvm, wasmJs, nativeCompile]
        exclude:
          # WASM builds only on Ubuntu for consistency
          - os: macos-latest
            target: wasmJs
          - os: windows-latest
            target: wasmJs
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 📋 Cache Gradle Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: 🔧 Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: 🏗️ Build ${{ matrix.target }} Target
      run: |
        case "${{ matrix.target }}" in
          "jvm")
            ./gradlew :rtsgame:compileKotlinJvm :rtsgame:jvmJar --scan
            ;;
          "wasmJs")
            ./gradlew :rtsgame:compileKotlinWasmJs :rtsgame:wasmJsJar --scan
            ;;
          "nativeCompile")
            ./gradlew :rtsgame:compileKotlinNative --scan
            ;;
        esac
        
    - name: 📦 Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.target }}
        path: |
          **/build/libs/
          **/build/js/
          **/build/bin/
        retention-days: 7

  # ==============================================================================
  # UNIT TESTS
  # ==============================================================================
  unit-tests:
    name: 🧪 Unit Tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [jvm, wasmJs]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 📋 Cache Gradle Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: unit-tests-gradle-${{ hashFiles('**/*.gradle*') }}
        
    - name: 🧪 Run Unit Tests
      run: |
        case "${{ matrix.target }}" in
          "jvm")
            ./gradlew :rtsgame:jvmTest --scan
            ;;
          "wasmJs")
            ./gradlew :rtsgame:wasmJsTest --scan
            ;;
        esac
        
    - name: 📊 Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.target }}
        path: |
          **/build/test-results/
          **/build/reports/tests/
          
    - name: 📋 Publish Test Results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Unit Tests (${{ matrix.target }})
        path: '**/build/test-results/**/TEST-*.xml'
        reporter: java-junit

  # ==============================================================================
  # INTEGRATION TESTS
  # ==============================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [build-matrix]
    
    services:
      # Add services if needed (Redis, PostgreSQL, etc.)
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 🌐 Setup Node.js for WASM tests
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: 📋 Cache Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.npm
        key: integration-gradle-${{ hashFiles('**/*.gradle*') }}
        
    - name: 🔗 Run Integration Tests
      run: |
        # Run cross-platform integration tests
        ./gradlew :rtsgame:integrationTest --scan
        
        # Test WASM module loading
        ./gradlew :rtsgame:wasmJsTest --scan
        
        # Test JVM desktop integration
        ./gradlew :rtsgame:jvmTest --scan
        
    - name: 🎮 Test Interactive Demo
      run: |
        # Build demo for testing
        ./gradlew :rtsgame:wasmJsJar
        
        # Test demo HTML structure
        cd rtsgame
        if [ -f "interactive-demo.html" ]; then
          echo "✅ Interactive demo HTML found"
          # Basic HTML validation
          grep -q "Interactive RTS WebGPU Demo" interactive-demo.html
          grep -q "START" interactive-demo.html
          grep -q "ADD UNIT" interactive-demo.html
          echo "✅ Demo HTML validation passed"
        fi
        
    - name: 📊 Upload Integration Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: |
          **/build/test-results/
          **/build/reports/

  # ==============================================================================
  # PERFORMANCE TESTS
  # ==============================================================================
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: [build-matrix]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: ⚡ Run Performance Benchmarks
      run: |
        ./gradlew :rtsgame:jvmBenchmark --scan
        
    - name: 📊 Performance Report
      run: |
        echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
        if [ -f "rtsgame/build/reports/jmh/results.json" ]; then
          echo "📈 JMH Benchmark results available" >> $GITHUB_STEP_SUMMARY
        fi
        
  # ==============================================================================
  # SECURITY SCANS
  # ==============================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔍 Run Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'superbikeshed'
        path: '.'
        format: 'ALL'
        
    - name: 📋 Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: reports/

  # ==============================================================================
  # CODE QUALITY
  # ==============================================================================
  code-quality:
    name: 🏆 Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 🧹 Run Detekt Static Analysis
      run: |
        ./gradlew detekt --scan
        
    - name: 📊 Upload Quality Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: quality-reports
        path: |
          **/build/reports/detekt/
          
  # ==============================================================================
  # DEPLOYMENT TESTS
  # ==============================================================================
  deployment-tests:
    name: 🚀 Deployment Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 🎮 Test Demo Deployment Package
      run: |
        cd rtsgame
        
        # Run deployment script
        if [ -f "deploy.sh" ]; then
          chmod +x deploy.sh
          ./deploy.sh
          
          # Verify deployment structure
          if [ -d "deploy" ]; then
            echo "✅ Deployment directory created"
            
            # Check required files
            [ -f "deploy/index.html" ] && echo "✅ index.html found"
            [ -f "deploy/README.md" ] && echo "✅ README.md found"  
            [ -f "deploy/rtsgame.mjs" ] && echo "✅ rtsgame.mjs found"
            [ -f "deploy/_config.yml" ] && echo "✅ _config.yml found"
            
            echo "🎯 Deployment package validation complete"
          fi
        fi
        
    - name: 📦 Upload Deployment Package
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: rtsgame/deploy/
        
  # ==============================================================================
  # FINAL STATUS
  # ==============================================================================
  ci-status:
    name: ✅ CI Status Report
    runs-on: ubuntu-latest
    needs: [build-matrix, unit-tests, integration-tests, performance-tests, security-scan, code-quality, deployment-tests]
    if: always()
    
    steps:
    - name: 📊 Generate Status Report
      run: |
        echo "# 🔥 CI Integration Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Build Matrix Status:" >> $GITHUB_STEP_SUMMARY
        echo "- **JVM Builds**: ${{ needs.build-matrix.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **WASM Builds**: ${{ needs.build-matrix.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Native Builds**: ${{ needs.build-matrix.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Results:" >> $GITHUB_STEP_SUMMARY
        echo "- **Unit Tests**: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Integration Tests**: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Performance Tests**: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Quality & Security:" >> $GITHUB_STEP_SUMMARY
        echo "- **Security Scan**: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Code Quality**: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Deployment:" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment Tests**: ${{ needs.deployment-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎮 **Interactive Demo**: Ready for gh_pages deployment"
        
        # Set overall status
        if [[ "${{ needs.unit-tests.result }}" == "success" && "${{ needs.integration-tests.result }}" == "success" ]]; then
          echo "🟢 **Overall Status**: PASSING" >> $GITHUB_STEP_SUMMARY
        else
          echo "🔴 **Overall Status**: FAILING" >> $GITHUB_STEP_SUMMARY
        fi