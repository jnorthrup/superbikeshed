name: 🔥 Comprehensive CI Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
  JAVA_VERSION: '21'
  KOTLIN_VERSION: '2.1.21'

jobs:
  # ==============================================================================
  # MULTIPLATFORM BUILD MATRIX
  # ==============================================================================
  build-matrix:
    name: 🏗️ Build Matrix (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [jvm, nativeCompile]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 📋 Cache Gradle Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: 🔧 Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: 🏗️ Build ${{ matrix.target }} Target
      run: |
        case "${{ matrix.target }}" in
          "jvm")
            ./gradlew :rtsgame:compileKotlinJvm :rtsgame:jvmJar --console=plain --no-daemon
            ;;
          "nativeCompile")
            ./gradlew :rtsgame:compileKotlinMacosArm64 --console=plain --no-daemon
            ;;
        esac
        
    - name: 📦 Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.target }}
        path: |
          **/build/libs/
          **/build/js/
          **/build/bin/
        retention-days: 7

  # ==============================================================================
  # UNIT TESTS
  # ==============================================================================
  unit-tests:
    name: 🧪 Unit Tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [jvm]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 📋 Cache Gradle Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: unit-tests-gradle-${{ hashFiles('**/*.gradle*') }}
        
    - name: 🧪 Run Unit Tests
      run: |
        case "${{ matrix.target }}" in
          "jvm")
            ./gradlew :rtsgame:jvmTest --console=plain --no-daemon
            ;;
        esac
        
    - name: 📊 Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.target }}
        path: |
          **/build/test-results/
          **/build/reports/tests/
          
    - name: 📋 Publish Test Results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Unit Tests (${{ matrix.target }})
        path: '**/build/test-results/**/TEST-*.xml'
        reporter: java-junit

  # ==============================================================================
  # INTEGRATION TESTS
  # ==============================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [build-matrix]
    
    services:
      # Add services if needed (Redis, PostgreSQL, etc.)
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 🌐 Setup Node.js for WASM tests
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: 📋 Cache Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.npm
        key: integration-gradle-${{ hashFiles('**/*.gradle*') }}
        
    - name: 🔗 Run Integration Tests
      run: |
        # Test JVM build and integration
        ./gradlew :rtsgame:build --console=plain --no-daemon
        
        # Test JVM tests
        ./gradlew :rtsgame:jvmTest --console=plain --no-daemon
        
    - name: 🎮 Test Interactive Demo
      run: |
        # Build demo for testing
        ./gradlew :rtsgame:wasmJsJar
        
        # Test demo HTML structure
        cd rtsgame
        if [ -f "interactive-demo.html" ]; then
          echo "✅ Interactive demo HTML found"
          # Basic HTML validation
          grep -q "Interactive RTS WebGPU Demo" interactive-demo.html
          grep -q "START" interactive-demo.html
          grep -q "ADD UNIT" interactive-demo.html
          echo "✅ Demo HTML validation passed"
        fi
        
    - name: 📊 Upload Integration Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: |
          **/build/test-results/
          **/build/reports/

  # ==============================================================================
  # COMPREHENSIVE CODE METRICS & DOCUMENTATION
  # ==============================================================================
  comprehensive-analysis:
    name: 📊 Comprehensive Code Analysis & Documentation
    runs-on: ubuntu-latest
    needs: [build-matrix]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 🔧 Install Analysis Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz cloc sonar-scanner-cli bc
        
        # Install additional analysis tools
        sudo apt-get install -y lizard clang-tidy cpplint cppcheck
        
        # Install Node.js tools for documentation
        npm install -g @mermaid-js/mermaid-cli
        
    - name: 📈 Generate Comprehensive Code Metrics
      run: |
        echo "# 📊 COMPREHENSIVE CODE ANALYSIS REPORT" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # ===== CODE STATISTICS =====
        echo "## 📏 Code Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        cloc . --exclude-dir=build,node_modules,.gradle --md >> cloc_output.md
        cat cloc_output.md >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # ===== HALSTEAD COMPLEXITY METRICS =====
        echo "## 🧮 Halstead Complexity Metrics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        TOTAL_OPERATORS=$(find . -name "*.kt" -o -name "*.java" | xargs grep -oE '(\+|\-|\*|\/|%|=|==|!=|<|>|<=|>=|&&|\|\||!|\?:|\.|\->|::)' | wc -l)
        TOTAL_OPERANDS=$(find . -name "*.kt" -o -name "*.java" | xargs grep -oE '\b[a-zA-Z_][a-zA-Z0-9_]*\b' | wc -l)
        UNIQUE_OPERATORS=$(find . -name "*.kt" -o -name "*.java" | xargs grep -oE '(\+|\-|\*|\/|%|=|==|!=|<|>|<=|>=|&&|\|\||!|\?:|\.|\->|::)' | sort -u | wc -l)
        UNIQUE_OPERANDS=$(find . -name "*.kt" -o -name "*.java" | xargs grep -oE '\b[a-zA-Z_][a-zA-Z0-9_]*\b' | sort -u | wc -l)
        
        PROGRAM_LENGTH=$((TOTAL_OPERATORS + TOTAL_OPERANDS))
        VOCABULARY=$((UNIQUE_OPERATORS + UNIQUE_OPERANDS))
        
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Program Length (N) | $PROGRAM_LENGTH |" >> $GITHUB_STEP_SUMMARY
        echo "| Vocabulary (n) | $VOCABULARY |" >> $GITHUB_STEP_SUMMARY
        echo "| Unique Operators (n₁) | $UNIQUE_OPERATORS |" >> $GITHUB_STEP_SUMMARY
        echo "| Unique Operands (n₂) | $UNIQUE_OPERANDS |" >> $GITHUB_STEP_SUMMARY
        echo "| Total Operators (N₁) | $TOTAL_OPERATORS |" >> $GITHUB_STEP_SUMMARY
        echo "| Total Operands (N₂) | $TOTAL_OPERANDS |" >> $GITHUB_STEP_SUMMARY
        
        # Calculate Halstead Volume and Difficulty
        if [ $VOCABULARY -gt 0 ] && [ $UNIQUE_OPERANDS -gt 0 ]; then
          VOLUME=$(echo "scale=2; $PROGRAM_LENGTH * l($VOCABULARY) / l(2)" | bc -l)
          DIFFICULTY=$(echo "scale=2; ($UNIQUE_OPERATORS / 2) * ($TOTAL_OPERANDS / $UNIQUE_OPERANDS)" | bc -l)
          EFFORT=$(echo "scale=2; $DIFFICULTY * $VOLUME" | bc -l)
          
          echo "| Halstead Volume (V) | $VOLUME bits |" >> $GITHUB_STEP_SUMMARY
          echo "| Halstead Difficulty (D) | $DIFFICULTY |" >> $GITHUB_STEP_SUMMARY
          echo "| Halstead Effort (E) | $EFFORT |" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        
    - name: 🎯 Complexity Analysis
      run: |
        echo "## 🎯 Cyclomatic Complexity Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Use lizard for complexity analysis
        lizard . -l kotlin -l java --md > complexity_report.md
        cat complexity_report.md >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Manual complexity metrics
        IF_COUNT=$(find . -name "*.kt" -o -name "*.java" | xargs grep -c '\bif\b' | awk '{sum += $1} END {print sum}')
        WHEN_COUNT=$(find . -name "*.kt" | xargs grep -c '\bwhen\b' | awk '{sum += $1} END {print sum}')
        SWITCH_COUNT=$(find . -name "*.java" | xargs grep -c '\bswitch\b' | awk '{sum += $1} END {print sum}')
        WHILE_COUNT=$(find . -name "*.kt" -o -name "*.java" | xargs grep -c '\bwhile\b' | awk '{sum += $1} END {print sum}')
        FOR_COUNT=$(find . -name "*.kt" -o -name "*.java" | xargs grep -c '\bfor\b' | awk '{sum += $1} END {print sum}')
        TRY_COUNT=$(find . -name "*.kt" -o -name "*.java" | xargs grep -c '\btry\b' | awk '{sum += $1} END {print sum}')
        
        echo "### Decision Point Distribution" >> $GITHUB_STEP_SUMMARY
        echo "| Control Structure | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|-------------------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| if statements | $IF_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| when expressions (Kotlin) | $WHEN_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| switch statements (Java) | $SWITCH_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| while loops | $WHILE_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| for loops | $FOR_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| try blocks | $TRY_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
    - name: 🏗️ Architecture & Design Metrics
      run: |
        echo "## 🏗️ Architecture & Design Metrics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Package and coupling analysis
        PACKAGE_COUNT=$(find . -name "*.kt" -o -name "*.java" | xargs grep -c '^package' | awk '{sum += $1} END {print sum}')
        IMPORT_COUNT=$(find . -name "*.kt" -o -name "*.java" | xargs grep -c '^import' | awk '{sum += $1} END {print sum}')
        CLASS_COUNT=$(find . -name "*.kt" | xargs grep -c '\bclass\b' | awk '{sum += $1} END {print sum}')
        INTERFACE_COUNT=$(find . -name "*.kt" -o -name "*.java" | xargs grep -c '\binterface\b' | awk '{sum += $1} END {print sum}')
        FUNCTION_COUNT=$(find . -name "*.kt" | xargs grep -c '\bfun\b' | awk '{sum += $1} END {print sum}')
        METHOD_COUNT=$(find . -name "*.java" | xargs grep -cE '\b(public|private|protected|static)\s+\w+.*\(' | awk '{sum += $1} END {print sum}')
        
        echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Packages | $PACKAGE_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| Import Statements | $IMPORT_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| Classes (Kotlin) | $CLASS_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| Interfaces | $INTERFACE_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| Functions (Kotlin) | $FUNCTION_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| Methods (Java) | $METHOD_COUNT |" >> $GITHUB_STEP_SUMMARY
        
        if [ $PACKAGE_COUNT -gt 0 ]; then
          AVG_IMPORTS=$(echo "scale=2; $IMPORT_COUNT / $PACKAGE_COUNT" | bc)
          echo "| Avg Imports per Package | $AVG_IMPORTS |" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # TrikeShed-specific architecture metrics
        echo "### TrikeShed Architecture Compliance" >> $GITHUB_STEP_SUMMARY
        
        JOIN_USAGE=$(find . -name "*.kt" | xargs grep -c '\bJoin<' | awk '{sum += $1} END {print sum}')
        SERIES_USAGE=$(find . -name "*.kt" | xargs grep -c '\bSeries<' | awk '{sum += $1} END {print sum}')
        ALPHA_TRANSFORMS=$(find . -name "*.kt" | xargs grep -c '\.α\s*{' | awk '{sum += $1} END {print sum}')
        INLINE_CLASSES=$(find . -name "*.kt" | xargs grep -c '@JvmInline' | awk '{sum += $1} END {print sum}')
        VALUE_CLASSES=$(find . -name "*.kt" | xargs grep -c 'value class' | awk '{sum += $1} END {print sum}')
        TYPEALIASES=$(find . -name "*.kt" | xargs grep -c '^typealias' | awk '{sum += $1} END {print sum}')
        
        echo "| TrikeShed Pattern | Usage Count |" >> $GITHUB_STEP_SUMMARY
        echo "|-------------------|-------------|" >> $GITHUB_STEP_SUMMARY
        echo "| Join<A,B> Usage | $JOIN_USAGE |" >> $GITHUB_STEP_SUMMARY
        echo "| Series<T> Usage | $SERIES_USAGE |" >> $GITHUB_STEP_SUMMARY
        echo "| α Transform Operations | $ALPHA_TRANSFORMS |" >> $GITHUB_STEP_SUMMARY
        echo "| @JvmInline Annotations | $INLINE_CLASSES |" >> $GITHUB_STEP_SUMMARY
        echo "| Value Classes | $VALUE_CLASSES |" >> $GITHUB_STEP_SUMMARY
        echo "| Type Aliases | $TYPEALIASES |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
    - name: 📚 Generate Doxygen Documentation with All Visualizations
      run: |
        echo "## 📚 Generating Comprehensive Doxygen Documentation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Create comprehensive Doxygen configuration
        cat > Doxyfile << 'EOF'
        PROJECT_NAME           = "TrikeShed Monorepo"
        PROJECT_NUMBER         = "2024.1"
        PROJECT_BRIEF          = "Production-grade distributed systems infrastructure with tensor-first columnar processing"
        OUTPUT_DIRECTORY       = docs/doxygen
        CREATE_SUBDIRS         = YES
        ALLOW_UNICODE_NAMES    = YES
        OUTPUT_LANGUAGE        = English
        
        # Input configuration
        INPUT                  = ./Trikeshed ./rtsgame ./moneyfan ./ta4k ./nexus ./k2script ./ksp-processors ./kotlin-entity-scanner ./spacegraph ./flatton
        INPUT_ENCODING         = UTF-8
        FILE_PATTERNS          = *.kt *.java *.kts *.md
        RECURSIVE              = YES
        EXCLUDE_PATTERNS       = */build/* */node_modules/* */.gradle/* */.*
        
        # Source browsing
        SOURCE_BROWSER         = YES
        INLINE_SOURCES         = YES
        STRIP_CODE_COMMENTS    = NO
        REFERENCED_BY_RELATION = YES
        REFERENCES_RELATION    = YES
        REFERENCES_LINK_SOURCE = YES
        SOURCE_TOOLTIPS        = YES
        USE_HTAGS              = NO
        VERBATIM_HEADERS       = YES
        
        # Preprocessing
        ENABLE_PREPROCESSING   = YES
        MACRO_EXPANSION        = YES
        EXPAND_ONLY_PREDEF     = NO
        SEARCH_INCLUDES        = YES
        
        # Output formats
        GENERATE_HTML          = YES
        GENERATE_LATEX         = NO
        GENERATE_RTF           = NO
        GENERATE_MAN           = NO
        GENERATE_XML           = YES
        GENERATE_DOCBOOK       = NO
        GENERATE_AUTOGEN_DEF   = NO
        GENERATE_PERLMOD       = NO
        
        # HTML output configuration
        HTML_OUTPUT            = html
        HTML_FILE_EXTENSION    = .html
        HTML_HEADER            =
        HTML_FOOTER            =
        HTML_STYLESHEET        =
        HTML_EXTRA_STYLESHEET  =
        HTML_EXTRA_FILES       =
        HTML_COLORSTYLE_HUE    = 220
        HTML_COLORSTYLE_SAT    = 100
        HTML_COLORSTYLE_GAMMA  = 80
        HTML_TIMESTAMP         = YES
        HTML_DYNAMIC_SECTIONS  = YES
        HTML_INDEX_NUM_ENTRIES = 100
        
        # Search engine
        SEARCHENGINE           = YES
        SERVER_BASED_SEARCH    = NO
        
        # ===== ALL VISUALIZATIONS ENABLED =====
        HAVE_DOT               = YES
        DOT_NUM_THREADS        = 0
        DOT_FONTNAME           = Helvetica
        DOT_FONTSIZE           = 10
        DOT_FONTPATH           =
        
        # Class diagrams
        CLASS_DIAGRAMS         = YES
        MSCGEN_PATH            =
        DIA_PATH               =
        HIDE_UNDOC_RELATIONS   = NO
        
        # Collaboration diagrams
        COLLABORATION_GRAPH    = YES
        GROUP_GRAPHS           = YES
        UML_LOOK               = YES
        UML_LIMIT_NUM_FIELDS   = 10
        TEMPLATE_RELATIONS     = YES
        
        # Include dependency graphs
        INCLUDE_GRAPH          = YES
        INCLUDED_BY_GRAPH      = YES
        
        # Call graphs
        CALL_GRAPH             = YES
        CALLER_GRAPH           = YES
        
        # Graphical hierarchy
        GRAPHICAL_HIERARCHY    = YES
        DIRECTORY_GRAPH        = YES
        
        # DOT graph generation
        DOT_IMAGE_FORMAT       = png
        INTERACTIVE_SVG        = YES
        DOT_PATH               =
        DOTFILE_DIRS           =
        MSCFILE_DIRS           =
        DIAFILE_DIRS           =
        PLANTUML_JAR_PATH      =
        PLANTUML_CFG_FILE      =
        PLANTUML_INCLUDE_PATH  =
        DOT_GRAPH_MAX_NODES    = 50
        MAX_DOT_GRAPH_DEPTH    = 0
        DOT_TRANSPARENT        = NO
        DOT_MULTI_TARGETS      = YES
        GENERATE_LEGEND        = YES
        DOT_CLEANUP            = YES
        
        # Documentation extraction
        EXTRACT_ALL            = YES
        EXTRACT_PRIVATE        = YES
        EXTRACT_PRIV_VIRTUAL   = YES
        EXTRACT_PACKAGE        = YES
        EXTRACT_STATIC         = YES
        EXTRACT_LOCAL_CLASSES  = YES
        EXTRACT_LOCAL_METHODS  = YES
        EXTRACT_ANON_NSPACES   = YES
        HIDE_UNDOC_MEMBERS     = NO
        HIDE_UNDOC_CLASSES     = NO
        HIDE_FRIEND_COMPOUNDS  = NO
        HIDE_IN_BODY_DOCS      = NO
        INTERNAL_DOCS          = YES
        CASE_SENSE_NAMES       = YES
        HIDE_SCOPE_NAMES       = NO
        HIDE_COMPOUND_REFERENCE= NO
        SHOW_INCLUDE_FILES     = YES
        SHOW_GROUPED_MEMB_INC  = YES
        FORCE_LOCAL_INCLUDES   = NO
        INLINE_INFO            = YES
        SORT_MEMBER_DOCS       = YES
        SORT_BRIEF_DOCS        = YES
        SORT_MEMBERS_CTORS_1ST = YES
        SORT_GROUP_NAMES       = YES
        SORT_BY_SCOPE_NAME     = NO
        STRICT_PROTO_MATCHING  = NO
        GENERATE_TODOLIST      = YES
        GENERATE_TESTLIST      = YES
        GENERATE_BUGLIST       = YES
        GENERATE_DEPRECATEDLIST= YES
        MAX_INITIALIZER_LINES  = 30
        SHOW_USED_FILES        = YES
        SHOW_FILES             = YES
        SHOW_NAMESPACES        = YES
        
        # Tree view
        GENERATE_TREEVIEW      = YES
        ENUM_VALUES_PER_LINE   = 4
        TREEVIEW_WIDTH         = 250
        EXT_LINKS_IN_WINDOW    = NO
        
        # Formula support
        USE_MATHJAX            = YES
        MATHJAX_FORMAT         = HTML-CSS
        MATHJAX_RELPATH        = https://cdn.jsdelivr.net/npm/mathjax@2
        MATHJAX_EXTENSIONS     =
        MATHJAX_CODEFILE       =
        
        # Search functionality
        SEARCHENGINE           = YES
        SERVER_BASED_SEARCH    = NO
        EXTERNAL_SEARCH        = NO
        SEARCHDATA_FILE        = searchdata.xml
        EOF
        
        # Generate documentation
        doxygen Doxyfile
        
        echo "✅ Doxygen documentation generated with all visualizations enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Class Diagrams**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Collaboration Graphs**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Include Dependency Graphs**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Call Graphs**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Graphical Hierarchy**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Directory Graphs**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Interactive SVG**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Source Browser**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Tree View**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
    - name: 📖 Generate Complete KDoc Documentation
      run: |
        echo "## 📖 Generating Comprehensive KDoc Documentation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Configure Dokka for comprehensive documentation generation
        cat > build.gradle.kts.dokka << 'EOF'
        plugins {
            id("org.jetbrains.dokka") version "1.9.20"
        }
        
        subprojects {
            apply(plugin = "org.jetbrains.dokka")
        }
        
        tasks.dokkaHtmlMultiModule.configure {
            outputDirectory.set(file("docs/kdoc"))
            
            # Configure comprehensive documentation options
            dokkaSourceSets {
                configureEach {
                    includeNonPublic.set(true)
                    reportUndocumented.set(true)
                    documentedVisibilities.set(
                        setOf(
                            org.jetbrains.dokka.DokkaConfiguration.Visibility.PUBLIC,
                            org.jetbrains.dokka.DokkaConfiguration.Visibility.PROTECTED,
                            org.jetbrains.dokka.DokkaConfiguration.Visibility.INTERNAL,
                            org.jetbrains.dokka.DokkaConfiguration.Visibility.PRIVATE
                        )
                    )
                    
                    # Include all source sets
                    platform.set(org.jetbrains.dokka.Platform.common)
                    
                    # Configure external documentation links
                    externalDocumentationLink {
                        url.set(java.net.URL("https://kotlinlang.org/api/latest/jvm/stdlib/"))
                        packageListUrl.set(java.net.URL("https://kotlinlang.org/api/latest/jvm/stdlib/package-list"))
                    }
                    
                    externalDocumentationLink {
                        url.set(java.net.URL("https://kotlin.github.io/kotlinx.coroutines/"))
                        packageListUrl.set(java.net.URL("https://kotlin.github.io/kotlinx.coroutines/package-list"))
                    }
                    
                    # Configure samples and source links
                    skipEmptyPackages.set(false)
                    skipDeprecated.set(false)
                    suppressObviousFunctions.set(false)
                    
                    perPackageOption {
                        matchingRegex.set(".*\\.internal.*")
                        suppress.set(false)
                        includeNonPublic.set(true)
                    }
                }
            }
        }
        EOF
        
        # Add Dokka plugin to root build file temporarily
        if ! grep -q "dokka" build.gradle.kts; then
          echo "" >> build.gradle.kts
          echo "plugins {" >> build.gradle.kts
          echo "    id(\"org.jetbrains.dokka\") version \"1.9.20\" apply false" >> build.gradle.kts
          echo "}" >> build.gradle.kts
          echo "" >> build.gradle.kts
          echo "subprojects {" >> build.gradle.kts
          echo "    apply(plugin = \"org.jetbrains.dokka\")" >> build.gradle.kts
          echo "}" >> build.gradle.kts
        fi
        
        # Generate comprehensive KDoc documentation
        echo "Generating KDoc for all modules..." >> $GITHUB_STEP_SUMMARY
        
        # Generate individual module documentation
        for module in Trikeshed rtsgame moneyfan ta4k nexus k2script ksp-processors kotlin-entity-scanner spacegraph flatton; do
          if [ -d "$module" ]; then
            echo "- Generating KDoc for $module" >> $GITHUB_STEP_SUMMARY
            ./gradlew :$module:dokkaHtml --console=plain --no-daemon || echo "  ⚠️ $module KDoc generation failed" >> $GITHUB_STEP_SUMMARY
          fi
        done
        
        # Generate aggregated documentation
        echo "- Generating aggregated KDoc documentation" >> $GITHUB_STEP_SUMMARY
        ./gradlew dokkaHtmlMultiModule --console=plain --no-daemon || echo "  ⚠️ Aggregated KDoc generation failed" >> $GITHUB_STEP_SUMMARY
        
        # Generate additional documentation formats
        echo "- Generating KDoc in multiple formats" >> $GITHUB_STEP_SUMMARY
        ./gradlew dokkaGfm --console=plain --no-daemon || echo "  ⚠️ GFM KDoc generation failed" >> $GITHUB_STEP_SUMMARY
        ./gradlew dokkaJavadoc --console=plain --no-daemon || echo "  ⚠️ Javadoc KDoc generation failed" >> $GITHUB_STEP_SUMMARY
        
        # Count documentation coverage
        TOTAL_CLASSES=$(find . -name "*.kt" | xargs grep -c '\bclass\b' | awk '{sum += $1} END {print sum}')
        TOTAL_FUNCTIONS=$(find . -name "*.kt" | xargs grep -c '\bfun\b' | awk '{sum += $1} END {print sum}')
        DOCUMENTED_CLASSES=$(find . -name "*.kt" | xargs grep -B1 '\bclass\b' | grep -c '/\*\*' || echo 0)
        DOCUMENTED_FUNCTIONS=$(find . -name "*.kt" | xargs grep -B1 '\bfun\b' | grep -c '/\*\*' || echo 0)
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### KDoc Coverage Analysis" >> $GITHUB_STEP_SUMMARY
        echo "| Element Type | Total | Documented | Coverage |" >> $GITHUB_STEP_SUMMARY
        echo "|--------------|-------|------------|----------|" >> $GITHUB_STEP_SUMMARY
        
        if [ $TOTAL_CLASSES -gt 0 ]; then
          CLASS_COVERAGE=$(echo "scale=1; $DOCUMENTED_CLASSES * 100 / $TOTAL_CLASSES" | bc)
          echo "| Classes | $TOTAL_CLASSES | $DOCUMENTED_CLASSES | ${CLASS_COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ $TOTAL_FUNCTIONS -gt 0 ]; then
          FUNCTION_COVERAGE=$(echo "scale=1; $DOCUMENTED_FUNCTIONS * 100 / $TOTAL_FUNCTIONS" | bc)
          echo "| Functions | $TOTAL_FUNCTIONS | $DOCUMENTED_FUNCTIONS | ${FUNCTION_COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **KDoc Generation Status**:" >> $GITHUB_STEP_SUMMARY
        echo "- **HTML Documentation**: Generated" >> $GITHUB_STEP_SUMMARY
        echo "- **Markdown Documentation**: Generated" >> $GITHUB_STEP_SUMMARY
        echo "- **Javadoc Format**: Generated" >> $GITHUB_STEP_SUMMARY
        echo "- **Multi-Module Documentation**: Generated" >> $GITHUB_STEP_SUMMARY
        echo "- **API Coverage Analysis**: Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
    - name: 📦 Build & Performance Analysis
      run: |
        echo "## 📦 Build & Performance Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Build all projects and collect metrics
        BUILD_START=$(date +%s)
        if ./gradlew build --console=plain --no-daemon; then
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
          
          echo "✅ **Build Status**: SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "⏱️ **Build Time**: ${BUILD_TIME} seconds" >> $GITHUB_STEP_SUMMARY
          
          # Collect build artifacts metrics
          JAR_COUNT=$(find . -name "*.jar" | wc -l)
          TOTAL_JAR_SIZE=$(find . -name "*.jar" -exec du -ch {} \; | tail -1 | cut -f1)
          CLASS_COUNT=$(find . -name "*.class" | wc -l)
          
          echo "📊 **Build Artifacts**:" >> $GITHUB_STEP_SUMMARY
          echo "- JAR files: $JAR_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Total JAR size: $TOTAL_JAR_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- Compiled classes: $CLASS_COUNT" >> $GITHUB_STEP_SUMMARY
          
        else
          echo "❌ **Build Status**: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        
    - name: 📤 Upload Documentation & Reports
      uses: actions/upload-artifact@v4
      with:
        name: comprehensive-analysis-reports
        path: |
          docs/doxygen/
          docs/kdoc/
          **/build/dokka/
          *.md
          complexity_report.md
          cloc_output.md
        retention-days: 30
        
  # ==============================================================================
  # SECURITY SCANS
  # ==============================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔍 Run Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'superbikeshed'
        path: '.'
        format: 'ALL'
        
    - name: 📋 Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: reports/

  # ==============================================================================
  # CODE QUALITY
  # ==============================================================================
  code-quality:
    name: 🏆 Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 🧹 Run Detekt Static Analysis
      run: |
        ./gradlew detekt --scan
        
    - name: 📊 Upload Quality Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: quality-reports
        path: |
          **/build/reports/detekt/
          
  # ==============================================================================
  # DEPLOYMENT TESTS
  # ==============================================================================
  deployment-tests:
    name: 🚀 Deployment Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 🎮 Test Demo Deployment Package
      run: |
        cd rtsgame
        
        # Run deployment script
        if [ -f "deploy.sh" ]; then
          chmod +x deploy.sh
          ./deploy.sh
          
          # Verify deployment structure
          if [ -d "deploy" ]; then
            echo "✅ Deployment directory created"
            
            # Check required files
            [ -f "deploy/index.html" ] && echo "✅ index.html found"
            [ -f "deploy/README.md" ] && echo "✅ README.md found"  
            [ -f "deploy/rtsgame.mjs" ] && echo "✅ rtsgame.mjs found"
            [ -f "deploy/_config.yml" ] && echo "✅ _config.yml found"
            
            echo "🎯 Deployment package validation complete"
          fi
        fi
        
    - name: 📦 Upload Deployment Package
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: rtsgame/deploy/
        
  # ==============================================================================
  # FINAL STATUS
  # ==============================================================================
  ci-status:
    name: ✅ CI Status Report
    runs-on: ubuntu-latest
    needs: [build-matrix, unit-tests, integration-tests, comprehensive-analysis, security-scan, code-quality, deployment-tests]
    if: always()
    
    steps:
    - name: 📊 Generate Status Report
      run: |
        echo "# 🔥 CI Integration Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Build Matrix Status:" >> $GITHUB_STEP_SUMMARY
        echo "- **JVM Builds**: ${{ needs.build-matrix.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **WASM Builds**: ${{ needs.build-matrix.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Native Builds**: ${{ needs.build-matrix.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Results:" >> $GITHUB_STEP_SUMMARY
        echo "- **Unit Tests**: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Integration Tests**: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Performance Tests**: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Quality & Security:" >> $GITHUB_STEP_SUMMARY
        echo "- **Security Scan**: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Code Quality**: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Deployment:" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment Tests**: ${{ needs.deployment-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎮 **Interactive Demo**: Ready for gh_pages deployment"
        
        # Set overall status
        if [[ "${{ needs.unit-tests.result }}" == "success" && "${{ needs.integration-tests.result }}" == "success" ]]; then
          echo "🟢 **Overall Status**: PASSING" >> $GITHUB_STEP_SUMMARY
        else
          echo "🔴 **Overall Status**: FAILING" >> $GITHUB_STEP_SUMMARY
        fi