name: QUIC Live Integration Tests

on:
  push:
    branches: [ main, repair/merge_with_oversight ]
    paths: 
      - 'Trikeshed/src/**/*quic*'
      - 'Trikeshed/src/**/*Quic*'
      - '.github/workflows/quic-integration-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Trikeshed/src/**/*quic*'
      - 'Trikeshed/src/**/*Quic*'

jobs:
  quic-socket-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        java-version: ['17', '21']
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper
        
    - name: Configure localhost networking for QUIC tests
      run: |
        # Ensure localhost is properly configured
        echo "127.0.0.1 localhost" | sudo tee -a /etc/hosts
        
        # Configure kernel networking for high-frequency UDP testing
        echo 'net.core.rmem_default = 262144' | sudo tee -a /etc/sysctl.conf
        echo 'net.core.rmem_max = 16777216' | sudo tee -a /etc/sysctl.conf 
        echo 'net.core.wmem_default = 262144' | sudo tee -a /etc/sysctl.conf
        echo 'net.core.wmem_max = 16777216' | sudo tee -a /etc/sysctl.conf
        echo 'net.core.netdev_max_backlog = 5000' | sudo tee -a /etc/sysctl.conf
        sudo sysctl -p
        
        # Verify UDP port range availability
        netstat -tuln | grep ':94[4-6][0-9]' || echo "QUIC test ports available"
        
    - name: Run QUIC Server Socket Tests
      run: |
        cd Trikeshed
        ./gradlew test --tests="borg.trikeshed.net.quic.LiveQuicServerTest" \
          --info --stacktrace \
          -Dkotlin.test.timeout=30000 \
          -Djava.net.preferIPv4Stack=true
          
    - name: Run QUIC Client Socket Tests  
      run: |
        cd Trikeshed
        ./gradlew test --tests="borg.trikeshed.net.quic.LiveQuicClientTest" \
          --info --stacktrace \
          -Dkotlin.test.timeout=30000 \
          -Djava.net.preferIPv4Stack=true
          
    - name: Run QUIC Integration Tests (Full Client-Server)
      run: |
        cd Trikeshed
        ./gradlew test --tests="borg.trikeshed.net.quic.LiveQuicIntegrationTest" \
          --info --stacktrace \
          -Dkotlin.test.timeout=60000 \
          -Djava.net.preferIPv4Stack=true
          
    - name: Monitor system resources during abusive traffic tests
      if: always()
      run: |
        echo "=== Network Statistics ===" 
        netstat -s | grep -i udp || true
        echo "=== Socket Statistics ==="
        ss -u -a | grep :94 || echo "No QUIC test sockets active"
        echo "=== Memory Usage ==="
        free -h
        echo "=== Process List ==="
        ps aux | grep -E "(gradle|java|kotlin)" | head -10 || true
        
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quic-test-reports-java-${{ matrix.java-version }}
        path: |
          Trikeshed/build/reports/tests/
          Trikeshed/build/test-results/
        retention-days: 7
        
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: quic-test-logs-java-${{ matrix.java-version }}
        path: |
          Trikeshed/build/test-results/test/binary/
          ~/.gradle/daemon/*/daemon-*.out.log
        retention-days: 14

  quic-stress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quic-socket-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || contains(github.ref, 'quic'))
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Configure system for stress testing
      run: |
        # Increase limits for stress testing
        echo 'net.core.rmem_max = 134217728' | sudo tee -a /etc/sysctl.conf  # 128MB
        echo 'net.core.wmem_max = 134217728' | sudo tee -a /etc/sysctl.conf  # 128MB
        echo 'net.core.netdev_max_backlog = 30000' | sudo tee -a /etc/sysctl.conf
        echo 'net.ipv4.udp_rmem_min = 8192' | sudo tee -a /etc/sysctl.conf
        echo 'net.ipv4.udp_wmem_min = 8192' | sudo tee -a /etc/sysctl.conf
        sudo sysctl -p
        
        # Increase file descriptor limits
        ulimit -n 65536
        echo "$(whoami) soft nofile 65536" | sudo tee -a /etc/security/limits.conf
        echo "$(whoami) hard nofile 65536" | sudo tee -a /etc/security/limits.conf
        
    - name: Run QUIC Abusive Traffic Stress Tests
      timeout-minutes: 15
      run: |
        cd Trikeshed
        ./gradlew test \
          --tests="*LiveQuicIntegrationTest.abusive traffic patterns stress testing*" \
          --info --stacktrace \
          -Dkotlin.test.timeout=900000 \
          -Djava.net.preferIPv4Stack=true \
          -XX:+UseG1GC \
          -XX:MaxGCPauseMillis=200 \
          -Xmx2g
          
    - name: System performance analysis post-stress
      if: always()  
      run: |
        echo "=== Network Interface Statistics ==="
        cat /proc/net/dev | grep -v "Inter\|face" || true
        echo "=== UDP Statistics ==="
        cat /proc/net/snmp | grep Udp || true
        echo "=== Socket Statistics ==="
        ss -s || true
        echo "=== Load Average ==="
        uptime
        echo "=== Memory Fragmentation ==="
        cat /proc/buddyinfo || true
        
    - name: Upload stress test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quic-stress-test-results
        path: |
          Trikeshed/build/reports/tests/
          /tmp/quic-performance-*.log
        retention-days: 30

  quic-compatibility-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['17']
      fail-fast: false
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Configure platform networking (Unix)
      if: runner.os != 'Windows'
      run: |
        # Platform-specific localhost configuration
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          sudo sysctl -w net.inet.udp.maxdgram=65507
        else
          sudo sysctl -w net.core.rmem_max=8388608
          sudo sysctl -w net.core.wmem_max=8388608
        fi
        
    - name: Configure platform networking (Windows)
      if: runner.os == 'Windows' 
      run: |
        # Windows networking configuration
        netsh int ipv4 set global autotuninglevel=normal
        netsh int udp set global uro=enabled
        
    - name: Run basic QUIC socket compatibility tests
      run: |
        cd Trikeshed
        ./gradlew test \
          --tests="*LiveQuicServerTest.server binds to localhost*" \
          --tests="*LiveQuicClientTest.client connects to server*" \
          --info \
          -Dkotlin.test.timeout=30000 \
          -Djava.net.preferIPv4Stack=true
          
    - name: Platform-specific diagnostics
      if: failure()
      run: |
        echo "=== Platform Information ==="
        uname -a || systeminfo || true
        echo "=== Network Configuration ==="
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          ipconfig /all || true
        else
          ifconfig || ip addr show || true
        fi
        echo "=== Active Connections ==="
        netstat -an | grep -E ":94[4-6][0-9]" || true