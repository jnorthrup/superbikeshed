# This configuration requires an Nginx build with HTTP/3 and QUIC support.
# For Docker, consider using an image like 'nginxinc/nginx-quic' or one built with BoringSSL.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP Server for HTTP/1.1
    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /http_version {
            default_type text/plain;
            return 200 "Request HTTP Version: $server_protocol\n";
        }

        # Disable access logging for this server block for cleaner test output
        access_log off;
        error_log /dev/stderr warn; # Log errors to stderr
    }

    # HTTPS Server for HTTP/2 and HTTP/3 (QUIC)
    server {
        listen 8081 ssl http2; # Listen for HTTPS/HTTP2 on TCP
        listen 8081 quic reuseport; # Listen for QUIC/HTTP3 on UDP

        server_name localhost;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # Add some common SSL settings (though with placeholder certs, full functionality isn't expected)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # HTTP/3 specific settings
        http3 on;
        add_header Alt-Svc 'h3=":8081"; ma=86400'; # Advertise HTTP/3 on UDP port 8081

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /http_version {
            default_type text/plain;
            return 200 "Request HTTP Version: $server_protocol\n";
        }

        # Disable access logging for this server block for cleaner test output
        access_log off;
        error_log /dev/stderr warn; # Log errors to stderr
    }
}
