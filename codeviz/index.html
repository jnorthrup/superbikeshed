<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Visualizer Blackboard</title>
    <link rel="stylesheet" href="lib/spacegraph.css">
    <link rel="stylesheet" href="css/style.css"> <!-- Placeholder for custom styles -->
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; background-color: #f0f0f0; }
        #blackboard-container { flex-grow: 1; position: relative; background-color: #333; }
        #chat-container { width: 300px; background-color: #fff; display: flex; flex-direction: column; border-left: 1px solid #ccc; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 10px; border-bottom: 1px solid #eee; }
        #message-input { border: none; padding: 10px; font-size: 1em; }
        #controls { padding: 10px; background-color: #eee; }
    </style>
</head>
<body>
    <div id="blackboard-container">
        <!-- SpaceGraph will render here -->
    </div>
    <div id="chat-container">
        <div id="messages">
            <p>Chat initialized...</p>
        </div>
        <input type="text" id="message-input" placeholder="Type message...">
    </div>
    <div id="controls">
        <button id="addNodeBtn">Add Test Node</button>
        <button id="saveContextBtn">Save Context</button>
        <button id="loadContextBtn">Load Saved Context</button>
        <button id="loadMockContextBtn">Load Mock Context</button>
    </div>

    <!-- Libraries -->
    <!-- GSAP (GreenSock Animation Platform) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- THREE.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="lib/spacegraph.js"></script>
    <!-- App scripts -->
    <script type="module" src="js/ircClient.js"></script>
    <script type="module" src="js/chat.js"></script>
    <script type="module" src="js/repoAnalyzer.js"></script>
    <script type="module" src="js/main.js"></script> <!-- main.js might depend on others, so often good to have it last -->
</body>
</html>
