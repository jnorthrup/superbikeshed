     <div id="summary">Access to this site is blocked at the direction of the venue providing this service as a courtesy to guests and customers.</div>
</div>
<script type="text/javascript">
function getCookie(cname) {
    var name = cname + "=";
    var ca = document.cookie.split(';');
    for(var i = 0; i <ca.length; i++) {
        var c = ca[i];
        while (c.charAt(0)==' ') {
            c = c.substring(1);
        }
        if (c.indexOf(name) == 0) {
            return c.substring(name.length,c.length);
        }
    }
        return "";
}


(function checkLanguage() {
	var LANG_COOKIE="splashLanguageSelection";
	var en_summary = "Access to this site is blocked at the direction of the venue providing this service as a courtesy to guests and customers.";
	var fr_summary = "L&#39;acc&#232s &#224; ce site est bloqu&#233; au niveau de la direction du lieu fournissant ce service &#224; titre de courtoisie pour les clients.";
	var es_summary = "El acceso a este sitio est&#225; bloqueado por orden del lugar que brinda este servicio de cortes&#237;a para invitados y clientes.";
	var en_title = "Web page blocked";
	var fr_title = "P&#225;gina Web Bloqueada";
	var es_title = "Page Web bloqu&#233;e";
	
	var browserLanguage=(document.getElementById("accept_language").value).toLowerCase();
	var cookieLanguage=(getCookie(LANG_COOKIE)).toLowerCase();
	
	if(cookieLanguage=="fr-ca" || cookieLanguage=="es-mx"){
			if(cookieLanguage.indexOf("es-mx")>= 0){
				document.getElementById("summary").innerHTML = es_summary;
				document.getElementById("title").innerHTML = es_title;
			}else if(browserLanguage.indexOf("es-mx")>=0 && cookieLanguage==''){
				document.getElementById("title").innerHTML = es_title;
				document.getElementById("summary").innerHTML = es_summary;
			}
			
			if(cookieLanguage.indexOf("fr-ca")>= 0){
				document.getElementById("summary").innerHTML = fr_summary;
				document.getElementById("title").innerHTML = fr_title;
			}else if(browserLanguage.indexOf("fr-ca")>=0 && cookieLanguage==''){
				document.getElementById("title").innerHTML = fr_title;
				document.getElementById("summary").innerHTML = fr_summary;
			}
		}else{document.getElementById("title").innerHTML = en_title;
		 document.getElementById("summary").innerHTML = en_summary;
	}
})();
</script>
