# Configuration for the Audit Tester

service_endpoint: "https://api.example.com/v1"
timeout_seconds: 30

# List of test definitions to be executed by the TestRunner
tests_to_run:
  - module: HTTPTestModule
    function: check_url_status
    test_name: "Google Status Check (200)"
    args:
      url: "https://www.google.com"
      expected_status_code: 200

  - module: HTTPTestModule
    function: check_url_status
    test_name: "Example.com Status Check for Non-existent Page (Simulated 404)"
    args:
      url: "http://example.com/nonexistentpage"
      expected_status_code: 404 # Simulation in main.py forces this for now

  - module: HTTPTestModule
    function: check_http_version
    test_name: "Google HTTP Version Check (Simulated HTTP/2)"
    args:
      url: "https://www.google.com"
      expected_version: "HTTP/2" # Simulation in main.py forces this

  - module: HTTPTestModule
    function: check_http_version
    test_name: "Example.com HTTP Version Check (Simulated HTTP/1.1)"
    args:
      url: "http://example.com"
      expected_version: "HTTP/1.1" # Simulation in main.py forces this

  - module: HTTPTestModule
    function: check_url_status
    test_name: "Invalid Host Status Check (Simulated Curl Error)"
    args:
      url: "https://invalid.host.name.that.does.not.exist"
      expected_status_code: 200 # Test expects failure before status check

  # --- QUIC/HTTP/3 Tests (using simulated Trikeshed client behavior in QuicHttp3TestModule) ---
  - module: QuicHttp3TestModule
    function: check_quic_handshake
    test_name: "QUIC Handshake quic.rocks:4433 (Simulated)"
    args:
      host: "quic.rocks"
      port: 4433

  - module: QuicHttp3TestModule
    function: check_quic_handshake
    test_name: "QUIC Handshake expired.badssl.com:443 (Simulated Failure)"
    args:
      host: "expired.badssl.com"
      port: 443 # Standard HTTPS port, but QUIC might be on 443 too

  - module: QuicHttp3TestModule
    function: check_http3_request
    test_name: "HTTP/3 Request quic.rocks:4433 (Simulated)"
    args:
      url: "https://quic.rocks:4433/"
      expected_status_code: 200

  - module: QuicHttp3TestModule
    function: check_http3_request
    test_name: "HTTP/3 Request cloudflare-quic.com (Simulated)"
    args:
      url: "https://cloudflare-quic.com/" # Another known H3 site
      expected_status_code: 200

  # --- CouchDB Tests (Simulated via run_bash_command_via_tool in main.py) ---
  - module: CouchDBTestModule
    function: check_server_running
    test_name: "CouchDB Server Running localhost:5984 (Simulated)"
    args:
      base_url: "http://localhost:5984"

  - module: CouchDBTestModule
    function: check_database_exists
    test_name: "CouchDB Database _users Exists (Simulated 200)"
    args:
      base_url: "http://localhost:5984"
      db_name: "_users"
      expected_status_code: 200 # Default, but explicit here

  - module: CouchDBTestModule
    function: check_create_database
    test_name: "CouchDB Create audit_test_db (Simulated)"
    args:
      base_url: "http://localhost:5984"
      db_name: "audit_test_db"

  - module: CouchDBTestModule
    function: check_database_exists # Verify creation
    test_name: "CouchDB Database audit_test_db Exists After Create (Simulated 200)"
    args:
      base_url: "http://localhost:5984"
      db_name: "audit_test_db"
      expected_status_code: 200

  - module: CouchDBTestModule
    function: check_delete_database
    test_name: "CouchDB Delete audit_test_db (Simulated)"
    args:
      base_url: "http://localhost:5984"
      db_name: "audit_test_db"

  - module: CouchDBTestModule
    function: check_database_exists # Verify deletion
    test_name: "CouchDB Database audit_test_db Not Exists After Delete (Simulated 404)"
    args:
      base_url: "http://localhost:5984"
      db_name: "audit_test_db"
      expected_status_code: 404 # Check for non-existence

  # --- IPFS Tests (Simulated via run_bash_command_via_tool in main.py) ---
  - module: IPFSTestModule
    function: check_node_id
    test_name: "IPFS Node ID localhost:5001 (Simulated)"
    args:
      api_url: "http://localhost:5001"

  - module: IPFSTestModule
    function: check_add_string
    test_name: "IPFS Add 'Hello IPFS' (Simulated)"
    args:
      api_url: "http://localhost:5001"
      test_string: "Hello IPFS from Audit Tester" # String to be added

  - module: IPFSTestModule
    function: check_cat_content
    test_name: "IPFS Cat Known CID QmZ4d... (Simulated)"
    args:
      api_url: "http://localhost:5001"
      cid: "QmZ4d7p2U9sSYK7VVaYQifdx3Y3zG21x73X8jTCy2F1YPc" # CID for "Hello World\n"
      expected_content: "Hello World\n"

  - module: IPFSTestModule
    function: check_pin_object
    test_name: "IPFS Pin Known CID QmZ4d... (Simulated)"
    args:
      api_url: "http://localhost:5001"
      cid_to_pin: "QmZ4d7p2U9sSYK7VVaYQifdx3Y3zG21x73X8jTCy2F1YPc"

  - module: IPFSTestModule
    function: check_verify_pin
    test_name: "IPFS Verify Pin for QmZ4d... (Simulated)"
    args:
      api_url: "http://localhost:5001"
      pinned_cid: "QmZ4d7p2U9sSYK7VVaYQifdx3Y3zG21x73X8jTCy2F1YPc"

  # --- Command Line Tools Tests (Simulated via run_bash_command_via_tool in main.py) ---
  - module: CmdToolsTestModule
    function: check_curl_download
    test_name: "Curl Download 1Mb.dat (Simulated)"
    args:
      url: "https://proof.ovh.net/files/1Mb.dat"
      output_file: "curl_test_1Mb.dat"
      expected_http_code: 200

  - module: CmdToolsTestModule
    function: check_curl_header
    test_name: "Curl Header google.com Content-Type (Simulated)"
    args:
      url: "https://www.google.com"
      header_name: "Content-Type"
      expected_header_value_contains: "text/html"

  - module: CmdToolsTestModule
    function: check_run_arbitrary_command
    test_name: "Cleanup curl_test_1Mb.dat (Simulated)"
    args:
      command: "rm -f curl_test_1Mb.dat" # Actual command for cleanup
      expected_exit_code: 0

  - module: CmdToolsTestModule
    function: check_aria2c_download
    test_name: "Aria2c Download 10Mb.dat (Simulated)"
    args:
      url: "https://proof.ovh.net/files/10Mb.dat"
      output_dir: "aria2c_downloads_sim" # Use _sim to avoid conflict if dir actually created
      output_filename: "aria2c_test_10Mb.dat"

  - module: CmdToolsTestModule
    function: check_run_arbitrary_command
    test_name: "Cleanup aria2c_downloads_sim (Simulated)"
    args:
      command: "rm -rf aria2c_downloads_sim"
      expected_exit_code: 0

  # Conceptual Metalink test - this URL is a placeholder and will likely fail if not simulated.
  # The simulation for aria2c metalink in main.py is generic.
  - module: CmdToolsTestModule
    function: check_aria2c_metalink_download
    test_name: "Aria2c Metalink Download placeholder (Simulated)"
    args:
      metalink_file_url: "https://example.com/some.metalink" # Placeholder URL
      output_dir: "aria2c_metalink_downloads_sim"

  - module: CmdToolsTestModule
    function: check_run_arbitrary_command
    test_name: "Cleanup aria2c_metalink_downloads_sim (Simulated)"
    args:
      command: "rm -rf aria2c_metalink_downloads_sim"
      expected_exit_code: 0

  # --- K2Script Servlet Tests (Simulated via run_bash_command_via_tool in main.py) ---
  # These tests assume a k2script HTTP server is running at the specified base URL.
  # Setup/teardown of such a server would ideally be handled by CmdToolsTestModule
  # commands in a real test suite, but here we focus on testing the endpoints.

  - module: K2ScriptTestModule
    function: check_servlet_endpoint
    test_name: "K2Script Servlet /hello (Simulated)"
    args:
      server_base_url: "http://localhost:8090" # Assumed k2script server URL
      request_path: "/hello"
      expected_status_code: 200
      expected_response_contains: "Hello from k2script servlet"

  - module: K2ScriptTestModule
    function: check_servlet_endpoint
    test_name: "K2Script Servlet POST /data (Simulated)"
    args:
      server_base_url: "http://localhost:8090"
      request_path: "/data"
      http_method: "POST"
      expected_status_code: 201
      # Example of how one might pass data; ensure extra_curl_options is handled by simulation if used.
      # extra_curl_options: "-d '{\"key\":\"value\"}' -H 'Content-Type: application/json'"
      # For this simulation, we'll assume the POST doesn't require specific data to get a 201.
      # If it did, the simulation in main.py would need to be more specific for the command generated with these options.

  - module: K2ScriptTestModule
    function: check_servlet_endpoint
    test_name: "K2Script Servlet /notfound (Simulated 404)"
    args:
      server_base_url: "http://localhost:8090"
      request_path: "/notfound"
      expected_status_code: 404

  # --- Additional HTTPTestModule Cases ---
  - module: HTTPTestModule
    function: check_url_status
    test_name: "HTTP Status Non-Existent Domain (Simulated Curl Error)"
    args:
      url: "http://thisshouldnotexistforsure whatsoever.com/"
      expected_status_code: 0 # Or a specific error code if curl returns something else for host not found in -w

  # Assuming no easy public HTTP/1.0 server, will skip adding specific 1.0 test for now.
  # Simulation would be needed anyway.

  # --- Additional QuicHttp3TestModule Cases ---
  - module: QuicHttp3TestModule
    function: check_quic_handshake
    test_name: "QUIC Handshake to Non-QUIC Port (e.g., Google HTTP port) (Simulated Failure)"
    args:
      host: "www.google.com"
      port: 80 # Standard HTTP, not QUIC
  - module: QuicHttp3TestModule
    function: check_http3_request
    test_name: "HTTP/3 Request to Non-H3 URL (Simulated H3 Error)"
    args:
      url: "https://www.google.com" # Google supports H3, but we'll simulate an error for this test.
      expected_status_code: 503 # Simulate a specific H3 error like "Service Unavailable"

  # --- Additional CouchDBTestModule Cases ---
  - module: CouchDBTestModule
    function: check_create_database
    test_name: "CouchDB Create Invalid DB Name '_audit_test_db_invalid' (Simulated Error)"
    args:
      base_url: "http://localhost:5984"
      db_name: "_audit_test_db_invalid" # Names starting with _ are reserved (usually)
      # Expecting this to fail based on simulation of CouchDB rules
  - module: CouchDBTestModule
    function: check_delete_database
    test_name: "CouchDB Delete Non-Existent DB 'non_existent_db_for_sure' (Simulated 404)"
    args:
      base_url: "http://localhost:5984"
      db_name: "non_existent_db_for_sure"
      # Expecting this to fail in the module as it asserts {"ok":true}, but simulation will return 404 error JSON

  # --- Additional IPFSTestModule Cases ---
  # The check_node_id test failure is due to strict CID validation for PeerIDs in the module.
  # The simulated PeerID 'QmSimulatedNodeId123abcxyz123abcxyz123abcxyz123' is a valid CID v0.
  # The module's _is_valid_cid might need adjustment for PeerID specifics if this pass is desired.
  # For now, acknowledging this in comments. Test definition remains as is.
  - module: IPFSTestModule
    function: check_cat_content
    test_name: "IPFS Cat Non-Existent CID (Simulated Error)"
    args:
      api_url: "http://localhost:5001"
      cid: "QmNonExistentCidHashValueThatIsNotPresent12345" # 46 chars
      expected_content: "This should not be found"
  - module: IPFSTestModule
    function: check_pin_object
    test_name: "IPFS Pin Invalid CID Format (Simulated Error)"
    args:
      api_url: "http://localhost:5001"
      cid_to_pin: "InvalidCIDFormatNotEvenAHash"

    # --- New IPFS Functionality Tests (Added by AI Agent) ---

    - module: IPFSTestModule
      function: check_add_string_with_deduplication_command
      test_name: "IPFS Deduplication: Add New String (Simulated)"
      args:
        api_url: "http://127.0.0.1:5001"
        test_string: "New string for deduplication test - check_add_string_with_deduplication_command"
      expected_outcome: "passed"
      description: "Deduplication: Add a completely new string."

    - module: IPFSTestModule
      function: check_add_string_with_deduplication_command
      test_name: "IPFS Deduplication: Add Existing String (Simulated)"
      args:
        api_url: "http://127.0.0.1:5001"
        test_string: "EXISTING_STRING_FOR_DEDUP_TEST" # Special string for main.py to simulate pre-existence
      expected_outcome: "passed"
      description: "Deduplication: Add a string that should already exist (simulated as pinned)."

    - module: IPFSTestModule
      function: check_cat_and_verify_hash_command
      test_name: "IPFS Cat & Verify Hash (Simulated)"
      args:
        api_url: "http://127.0.0.1:5001"
        cid_to_cat: "QmPZ9gcCEpqKTo6aq61g2nXGUhM4iCL3ewB6NEAOJVEcWn" # Placeholder for "Hello Cat Verify"
        original_test_string: "Hello Cat Verify"
      expected_outcome: "passed"
      description: "Cat content and verify its hash by re-adding with only-hash."

    - module: IPFSTestModule
      function: check_ipld_put_command # Defaults to dag-json
      test_name: "IPFS IPLD Put dag-json (Simulated)"
      args:
        api_url: "http://127.0.0.1:5001"
        json_string_data: '{"type": "dag-json", "data": "test1 for put"}'
      expected_outcome: "passed"
      description: "IPLD: Put a dag-json object."

    - module: IPFSTestModule
      function: check_ipld_get_command
      test_name: "IPFS IPLD Get dag-json (Simulated)"
      args:
        api_url: "http://127.0.0.1:5001"
        ipld_cid: "bafyreigajqj74nxdphj2hlmv24y2zxeotxdbcgg23f2jwvqj3bnkpik4z4" # Placeholder for '{"type": "dag-json", "data": "test1 for put"}'
        expected_json_string_data: '{"type": "dag-json", "data": "test1 for put"}'
      expected_outcome: "passed"
      description: "IPLD: Get a dag-json object."

    - module: IPFSTestModule
      function: check_ipld_put_command
      test_name: "IPFS IPLD Put dag-cbor (Simulated)"
      args:
        api_url: "http://127.0.0.1:5001"
        json_string_data: '{"type": "dag-cbor", "data": "test2 for put cbor"}'
        store_codec: "dag-cbor"
        input_codec: "dag-json" # We provide JSON, IPFS converts to CBOR for storage
      expected_outcome: "passed"
      description: "IPLD: Put a dag-cbor object (input as dag-json)."

    - module: IPFSTestModule
      function: check_ipld_get_command
      test_name: "IPFS IPLD Get dag-cbor as json (Simulated)"
      args:
        api_url: "http://127.0.0.1:5001"
        ipld_cid: "bafyreibcgr6noggry6veoewyuxr6ibvtoiseayj2shw2ambj766tr2k3ze" # Placeholder for '{"type": "dag-cbor", "data": "test2 for put cbor"}'
        expected_json_string_data: '{"type": "dag-cbor", "data": "test2 for put cbor"}' # API converts CBOR to JSON for GET
      expected_outcome: "passed"
      description: "IPLD: Get a dag-cbor object (retrieved as dag-json)."

    - module: IPFSTestModule
      function: check_hybrid_storage_pattern_command
      test_name: "IPFS Hybrid Storage Pattern (Simulated)"
      args:
        api_url: "http://127.0.0.1:5001"
        main_content_string: "Main hybrid content for test."
        attachment_string: "Attachment hybrid content for test."
        # metadata_store_codec: "dag-json" # Using default
      expected_outcome: "passed"
      description: "Hybrid: Test IPLD metadata linking to other IPFS objects."

  # --- Additional CmdToolsTestModule Cases ---
  - module: CmdToolsTestModule
    function: check_curl_download
    test_name: "Curl Download 404 URL (Simulated)"
    args:
      url: "http://example.com/definitely-not-here.txt"
      output_file: "curl_test_404.dat"
      expected_http_code: 404
  - module: CmdToolsTestModule
    function: check_aria2c_download
    test_name: "Aria2c Download Invalid URL (Simulated Error)"
    args:
      url: "ftp://invalidprotocolforsimulation/file.dat" # Or some other URL that simulation treats as error
      output_dir: "aria2c_error_downloads_sim"
      output_filename: "aria2c_error.dat"
      # Expecting non-zero exit code from aria2c, which our module asserts.

  # --- Additional K2ScriptTestModule Cases ---
  - module: K2ScriptTestModule
    function: check_servlet_endpoint
    test_name: "K2Script Servlet PUT /update (Simulated 200)"
    args:
      server_base_url: "http://localhost:8090"
      request_path: "/update"
      http_method: "PUT"
      # extra_curl_options: "-d '{\"update_key\":\"new_value\"}'"
      expected_status_code: 200
      expected_response_contains: "updated"
  - module: K2ScriptTestModule
    function: check_servlet_endpoint
    test_name: "K2Script Servlet /error (Simulated 500)"
    args:
      server_base_url: "http://localhost:8090"
      request_path: "/error"
      expected_status_code: 500
      expected_response_contains: "Internal Server Error"

