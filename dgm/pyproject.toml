[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-godel-machine"
version = "0.1.0"
description = "Darwin Gödel Machine: Open-Ended Evolution of Self-Improving Agents"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jenny Zhang"},
    {name = "Shengran Hu"},
    {name = "Cong Lu"},
    {name = "Robert Lange"},
    {name = "Jeff Clune"},
]
keywords = ["machine learning", "self-improvement", "coding agents", "evolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets",
    "anthropic",
    "anthropic[bedrock]",
    "backoff",
    "botocore",
    "boto3",
    "openai",
    "beautifulsoup4",
    "chardet",
    "docker",
    "ghapi",
    "GitPython",
    "pre-commit",
    "python-dotenv",
    "rich",
    "unidiff",
    "pytest",
    "pytest-asyncio",
    "async_timeout",
]

[project.optional-dependencies]
dev = [
    "graphviz",
    "pygraphviz",
    "matplotlib",
    "plotly",
    "networkx",
]

[project.urls]
Homepage = "https://github.com/jennyzzt/dgm"
Repository = "https://github.com/jennyzzt/dgm"
Documentation = "https://sakana.ai/dgm/"
"Bug Tracker" = "https://github.com/jennyzzt/dgm/issues"

[project.scripts]
dgm = "DGM_outer:main"

[tool.setuptools.packages.find]
include = ["analysis*", "polyglot*", "prompts*", "swe_bench*", "tools*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
