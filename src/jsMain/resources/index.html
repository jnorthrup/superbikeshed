<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA4K + SpaceGraph + Moneyfan DSEL Demo</title>
    <link rel="stylesheet" href="style.css">
    <!-- Assuming spacegraph.js itself or its kotlin wrapper doesn't inject its own base CSS.
         If it does, this might not be strictly needed or could be for overrides.
         The spacegraph.js from exploration used "index.css" in its examples.
         Let's assume a path like 'libs/spacegraph/index.css' might be where it's copied or linked.
    -->
    <link rel="stylesheet" href="libs/spacegraph/index.css"> <!-- Optional: if SpaceGraph has its own theme -->
    <style>
        /* Specific styles for this demo's UI controls */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background-color: #1e1e1e; color: #d4d4d4;}
        #demo-controls {
            padding: 12px;
            background: #2a2a2e; /* Darker background for controls */
            border-bottom: 1px solid #3a3a3e;
            display: flex;
            flex-flow: row wrap; /* Allow wrapping for many controls */
            gap: 12px; /* Increased gap */
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #demo-controls button,
        #demo-controls select,
        #demo-controls input[type="text"],
        #demo-controls input[type="number"] {
            padding: 8px 10px;
            background-color: #3c3c3c; /* Slightly lighter input background */
            color: #f0f0f0;
            border: 1px solid #555555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        #demo-controls button:hover { background-color: #4e4e4e; }
        #demo-controls input[type="checkbox"] { cursor: pointer; margin-right: 4px; vertical-align: middle;}
        #demo-controls label { margin-right: 5px; margin-left: 10px; font-size: 13px; vertical-align: middle; }
        #demo-controls label:first-child { margin-left: 0; }

        #demo-controls .control-group {
            padding: 8px 12px;
            border: 1px solid #4a4a4e;
            border-radius: 5px;
            background: #333337; /* Group background */
            display: flex;
            align-items: center;
            gap: 8px; /* Gap within groups */
        }
        #demo-controls .control-group legend {
            font-size: 11px; /* Smaller legend */
            font-weight: bold;
            color: #b0b0b0;
            padding: 0 6px;
            margin-left: -6px; /* Adjust legend position */
        }
        #space-container {
            flex-grow: 1;
            min-height: 0; /* Important for flex layout to prevent overflow */
            position: relative; /* For SpaceGraph's absolutely positioned children */
            overflow: hidden; /* Prevent scrollbars if canvas is exact size */
        }
        #status-bar {
            padding: 6px 12px;
            background: #222225;
            font-size: 12px;
            color: #cccccc;
            text-align: center;
            height: 22px; /* Slightly taller */
            line-height: 22px;
            border-top: 1px solid #3a3a3e;
        }
    </style>
</head>
<body>
    <div id="demo-controls">
        <fieldset class="control-group">
            <legend>DATA &amp; RENDER</legend>
            <button id="loadDataBtn" title="Fetch, parse, and process kline data">Load BTC/USDT Data</button>
            <button id="reprocessBtn" title="Apply parameter changes and redraw graph">Apply & Redraw</button>
        </fieldset>

        <fieldset class="control-group">
            <legend>TA PARAMETERS</legend>
            <label for="shortSmaInput">SMA-S:</label>
            <input type="number" id="shortSmaInput" value="10" min="1" max="100" style="width: 45px;" title="Short SMA Period">
            <label for="longSmaInput">SMA-L:</label>
            <input type="number" id="longSmaInput" value="20" min="2" max="200" style="width: 45px;" title="Long SMA Period">
            <label for="rsiPeriodInput">RSI-P:</label>
            <input type="number" id="rsiPeriodInput" value="14" min="2" max="50" style="width: 45px;" title="RSI Period">
        </fieldset>

        <fieldset class="control-group">
            <legend>MONEYFAN SIM</legend>
            <label for="assetSymbolInput">Asset:</label>
            <input type="text" id="assetSymbolInput" value="BTC" style="width: 45px;" title="Asset Symbol (e.g., BTC)">
            <label for="baselineInput">Baseline ($):</label>
            <input type="number" id="baselineInput" value="50000" step="100" style="width: 70px;" title="Asset Baseline Value">
            <button id="updateBaselineBtn" title="Set new baseline for the asset">Set Baseline</button>
            <input type="checkbox" id="adzToggle" title="Toggle Adaptive Dead Zone for asset">
            <label for="adzToggle">ADZ</label>
            <input type="checkbox" id="cpToggle" title="Toggle Global Crash Protection">
            <label for="cpToggle">Global CP</label>
        </fieldset>

        <fieldset class="control-group">
            <legend>FOCUS ATTENTION</legend>
            <label for="attentionSelect">Highlight MF Action:</label>
            <select id="attentionSelect" title="Highlight nodes based on Moneyfan Action">
                <option value="NONE_MF">None</option>
                <!-- MoneyfanActionType values will be populated here by Kotlin/JS -->
            </select>
        </fieldset>
    </div>

    <div id="space-container">
        <!-- SpaceGraph visualization canvas and CSS3D objects will be injected here -->
    </div>
    <div id="status-bar">[Status messages will appear here]</div>

    <!-- Ensure this path is correct based on your Kotlin/JS build output directory -->
    <script src="ta4k-spacegraph-moneyfan-demo.js"></script>
</body>
</html>
