<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS|Kotlin|Cppfront Gateway</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1a1a1a;
            padding: 12px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .logo {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }
        .editor-header {
            background: #1e1e1e;
            padding: 10px 15px;
            border-bottom: 1px solid #333;
            font-size: 14px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }
        .editor {
            flex: 1;
            padding: 20px;
            background: #0d0d0d;
            overflow-y: auto;
            position: relative;
        }
        .monaco-editor {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-x: auto;
            resize: none;
            border: 1px solid #333;
            color: #d4d4d4;
        }
        .output-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .output-tabs {
            display: flex;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-right: 1px solid #333;
            font-size: 14px;
            transition: background 0.2s;
        }
        .tab:hover {
            background: #2a2a2a;
        }
        .tab.active {
            background: #0d0d0d;
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }
        .output {
            flex: 1;
            padding: 20px;
            background: #0d0d0d;
            overflow-y: auto;
        }
        .code-output {
            background: #1e1e1e;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #d4d4d4;
        }
        .transpile-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: transform 0.2s;
        }
        .transpile-btn:hover {
            transform: scale(1.05);
        }
        .syntax-highlight {
            color: #569cd6;
        }
        .keyword {
            color: #c586c0;
        }
        .string {
            color: #ce9178;
        }
        .comment {
            color: #6a9955;
        }
        .type {
            color: #4ec9b0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">TS|K|C² Gateway</div>
        <div class="controls">
            <label>Source:</label>
            <select id="sourceLang">
                <option value="typescript">TypeScript</option>
                <option value="kotlin">Kotlin</option>
                <option value="cppfront">Cppfront</option>
            </select>
            <span>→</span>
            <label>Target:</label>
            <select id="targetLang">
                <option value="kotlin">Kotlin</option>
                <option value="typescript">TypeScript</option>
                <option value="cppfront">Cppfront</option>
            </select>
            <button class="transpile-btn" onclick="transpile()">Transpile</button>
        </div>
    </div>
    
    <div class="main">
        <div class="editor-pane">
            <div class="editor-header">
                <span id="sourceLabel">TypeScript</span>
                <span style="color: #666;">Semantic Analyzer Active</span>
            </div>
            <div class="editor">
                <textarea id="sourceCode" class="monaco-editor" spellcheck="false">// Example: Class with generics and methods
class Container<T> {
    private items: T[] = [];
    
    add(item: T): void {
        this.items.push(item);
    }
    
    get(index: number): T | undefined {
        return this.items[index];
    }
    
    size(): number {
        return this.items.length;
    }
}

// Function with type constraints
function process<T extends { id: number }>(items: T[]): number[] {
    return items.map(item => item.id);
}

// Interface/trait-like structure
interface Drawable {
    draw(): void;
}

class Circle implements Drawable {
    constructor(private radius: number) {}
    
    draw(): void {
        console.log(`Drawing circle with radius ${this.radius}`);
    }
}</textarea>
            </div>
        </div>
        
        <div class="output-pane">
            <div class="output-tabs">
                <div class="tab active" onclick="switchTab(0, this)">Target Output</div>
                <div class="tab" onclick="switchTab(1, this)">AST Structure</div>
                <div class="tab" onclick="switchTab(2, this)">Semantic Notes</div>
            </div>
            <div class="output">
                <div id="output-0" class="code-output">// Select source and target languages, then click Transpile</div>
                <div id="output-1" class="code-output" style="display:none;">// Abstract Syntax Tree will appear here</div>
                <div id="output-2" class="code-output" style="display:none;">// Semantic translation notes will appear here</div>
            </div>
        </div>
    </div>
    
    <script>
        const transpilers = {
            'typescript-kotlin': (code) => {
                return code
                    // Type annotations
                    .replace(/:\s*void/g, ': Unit')
                    .replace(/:\s*number/g, ': Int')
                    .replace(/:\s*string/g, ': String')
                    .replace(/:\s*boolean/g, ': Boolean')
                    .replace(/\|\s*undefined/g, '?')
                    
                    // Arrays
                    .replace(/(\w+)\[\]/g, 'List<$1>')
                    .replace(/Array<(\w+)>/g, 'List<$1>')
                    
                    // Functions and methods
                    .replace(/function\s+(\w+)/g, 'fun $1')
                    .replace(/(\w+)\((.*?)\):\s*(\w+)/g, (match, name, params, ret) => {
                        return ret === 'Unit' ? `${name}(${params})` : `${name}(${params}): ${ret}`;
                    })
                    
                    // Class members
                    .replace(/private\s+(\w+):/g, 'private val $1:')
                    .replace(/public\s+(\w+):/g, 'val $1:')
                    
                    // Control structures
                    .replace(/for\s*\(\s*const\s+(\w+)\s+of\s+([\w.]+)\s*\)/g, 'for ($1 in $2)')
                    .replace(/console\.log/g, 'println')
                    
                    // Interfaces to interfaces (Kotlin has them!)
                    .replace(/interface\s+/g, 'interface ')
                    .replace(/implements\s+/g, ': ')
                    
                    // Constructor
                    .replace(/constructor\s*\(/g, 'constructor(')
                    
                    // String templates
                    .replace(/\$\{([^}]+)\}/g, '${$1}')
                    
                    // Methods
                    .replace(/(\s+)(\w+)\((.*?)\):\s*([\w?]+)\s*{/g, '$1fun $2($3): $4 {')
                    .replace(/(\s+)(\w+)\((.*?)\):\s*void\s*{/g, '$1fun $2($3) {')
                    
                    // this -> this (same)
                    // Generics syntax is the same!
                    
                    // Push -> add for lists
                    .replace(/\.push\(/g, '.add(')
                    
                    // length -> size for collections
                    .replace(/\.length/g, '.size')
                    
                    // Fix array initialization
                    .replace(/=\s*\[\]/g, '= mutableListOf()')
                    
                    // Map function
                    .replace(/\.map\(/g, '.map { ')
                    .replace(/=>\s*/g, '-> ')
                    .replace(/item\s*->\s*item\.(\w+)\)/g, 'it.$1 }');
            },
            
            'typescript-cppfront': (code) => {
                return code
                    // Type annotations - cpp2 style
                    .replace(/:\s*void/g, ' -> void')
                    .replace(/:\s*number/g, ' -> int')
                    .replace(/:\s*string/g, ' -> std::string')
                    .replace(/:\s*boolean/g, ' -> bool')
                    .replace(/\|\s*undefined/g, '?')
                    
                    // Arrays to vectors
                    .replace(/(\w+)\[\]/g, 'std::vector<$1>')
                    .replace(/Array<(\w+)>/g, 'std::vector<$1>')
                    
                    // Class definition - cpp2 style
                    .replace(/class\s+(\w+)/g, '$1: type =')
                    .replace(/\s*{/g, ' {')
                    
                    // Methods - cpp2 unified function syntax
                    .replace(/(\s+)(\w+)\((.*?)\):\s*(\w+)\s*{/g, '$1$2: ($3) -> $4 = {')
                    .replace(/(\s+)(\w+)\((.*?)\):\s*void\s*{/g, '$1$2: ($3) = {')
                    
                    // Constructor -> operator=
                    .replace(/constructor\s*\(/g, 'operator=: (')
                    
                    // Member variables
                    .replace(/private\s+(\w+):\s*([\w<>]+)\s*=\s*([^;]+);?/g, '$1: $2 = $3;')
                    
                    // this -> this (cpp2 uses implicit this)
                    .replace(/this\./g, '')
                    
                    // console.log -> std::cout
                    .replace(/console\.log\(`([^`]+)`\)/g, 'std::cout << "$1" << std::endl')
                    .replace(/console\.log\(/g, 'std::cout << ')
                    
                    // Interfaces -> cpp2 interfaces
                    .replace(/interface\s+(\w+)/g, '$1: @interface type =')
                    .replace(/implements\s+/g, ': ')
                    
                    // String interpolation
                    .replace(/\$\{([^}]+)\}/g, '" << $1 << "')
                    
                    // Function declarations
                    .replace(/function\s+(\w+)/g, '$1:')
                    
                    // Generics
                    .replace(/<T>/g, '<T>')
                    .replace(/<T\s+extends\s+([^>]+)>/g, '<T: $1>')
                    
                    // Array methods
                    .replace(/\.push\(/g, '.push_back(')
                    .replace(/\.length/g, '.size()')
                    
                    // Fix remaining TypeScript specifics
                    .replace(/\[\]/g, '{}')
                    .replace(/=>/g, '->');
            },
            
            'kotlin-typescript': (code) => {
                return code
                    // Types
                    .replace(/:\s*Unit/g, ': void')
                    .replace(/:\s*Int/g, ': number')
                    .replace(/:\s*String/g, ': string')
                    .replace(/:\s*Boolean/g, ': boolean')
                    .replace(/\?/g, ' | undefined')
                    
                    // Collections
                    .replace(/List<(\w+)>/g, '$1[]')
                    .replace(/MutableList<(\w+)>/g, '$1[]')
                    .replace(/mutableListOf\(\)/g, '[]')
                    
                    // Functions
                    .replace(/fun\s+(\w+)/g, 'function $1')
                    .replace(/(\w+)\((.*?)\)\s*{/g, '$1($2): void {')
                    
                    // Classes and members
                    .replace(/val\s+/g, '')
                    .replace(/var\s+/g, 'let ')
                    
                    // Control flow
                    .replace(/for\s*\((\w+)\s+in\s+([\w.]+)\)/g, 'for (const $1 of $2)')
                    
                    // Output
                    .replace(/println/g, 'console.log')
                    
                    // Inheritance
                    .replace(/:\s+(\w+)/g, 'implements $1')
                    
                    // Methods with return types
                    .replace(/fun\s+(\w+)\((.*?)\):\s*(\w+)/g, '$1($2): $3')
                    
                    // Collection methods
                    .replace(/\.add\(/g, '.push(')
                    .replace(/\.size/g, '.length')
                    
                    // Lambda syntax
                    .replace(/\{\s*it\s*->\s*/g, 'item => ')
                    .replace(/\s*\}/g, ')');
            },
            
            'kotlin-cppfront': (code) => {
                // This is a simplified version - real implementation would need more work
                return code
                    .replace(/fun\s+(\w+)/g, '$1:')
                    .replace(/:\s*Int/g, ' -> int')
                    .replace(/:\s*String/g, ' -> std::string')
                    .replace(/:\s*Unit/g, ' -> void')
                    .replace(/class\s+(\w+)/g, '$1: type =')
                    .replace(/println/g, 'std::cout <<');
            },
            
            'cppfront-typescript': (code) => {
                return code
                    .replace(/(\w+):\s*type\s*=/g, 'class $1')
                    .replace(/:\s*\((.*?)\)\s*->\s*(\w+)\s*=/g, '($1): $2')
                    .replace(/:\s*\((.*?)\)\s*=/g, '($1): void')
                    .replace(/operator=:/g, 'constructor')
                    .replace(/std::vector<(\w+)>/g, '$1[]')
                    .replace(/std::string/g, 'string')
                    .replace(/int/g, 'number')
                    .replace(/bool/g, 'boolean')
                    .replace(/std::cout\s*<</g, 'console.log(');
            },
            
            'cppfront-kotlin': (code) => {
                return code
                    .replace(/(\w+):\s*type\s*=/g, 'class $1')
                    .replace(/:\s*\((.*?)\)\s*->\s*(\w+)\s*=/g, 'fun ($1): $2')
                    .replace(/operator=:/g, 'constructor')
                    .replace(/std::vector<(\w+)>/g, 'List<$1>')
                    .replace(/std::string/g, 'String')
                    .replace(/int/g, 'Int')
                    .replace(/bool/g, 'Boolean')
                    .replace(/std::cout\s*<</g, 'println(');
            }
        };
        
        function transpile() {
            const source = document.getElementById('sourceLang').value;
            const target = document.getElementById('targetLang').value;
            const sourceCode = document.getElementById('sourceCode').value;
            
            if (source === target) {
                document.getElementById('output-0').textContent = '// Source and target languages are the same';
                return;
            }
            
            const transpilerKey = `${source}-${target}`;
            const transpiler = transpilers[transpilerKey];
            
            if (transpiler) {
                const result = transpiler(sourceCode);
                document.getElementById('output-0').textContent = result;
                
                // Mock AST
                document.getElementById('output-1').textContent = `// Simplified AST for ${source} -> ${target}
{
  "type": "Program",
  "body": [
    {
      "type": "ClassDeclaration",
      "id": "Container",
      "typeParameters": ["T"],
      "members": [
        {"type": "PropertyDeclaration", "name": "items", "private": true},
        {"type": "MethodDeclaration", "name": "add", "params": ["item: T"]},
        {"type": "MethodDeclaration", "name": "get", "returns": "T?"},
        {"type": "MethodDeclaration", "name": "size", "returns": "number"}
      ]
    }
  ]
}`;
                
                // Semantic notes
                document.getElementById('output-2').textContent = `// Semantic Translation Notes: ${source} -> ${target}

1. Memory Management:
   ${source === 'cppfront' ? '- Source uses RAII/move semantics' : '- Source uses garbage collection'}
   ${target === 'cppfront' ? '- Target uses RAII/move semantics' : '- Target uses garbage collection'}
   ${source !== target && (source === 'cppfront' || target === 'cppfront') ? '- ⚠️ Memory model mismatch requires careful handling' : '- ✓ Compatible memory models'}

2. Type System:
   - Nullability: ${source === 'kotlin' ? 'Kotlin null-safety' : source === 'typescript' ? 'TS undefined unions' : 'C++ optionals'} 
     -> ${target === 'kotlin' ? 'Kotlin null-safety' : target === 'typescript' ? 'TS undefined unions' : 'C++ optionals'}
   - Generics: All three support similar generic constraints
   - Variance: ${source === 'kotlin' || target === 'kotlin' ? 'Kotlin has declaration-site variance' : 'Use-site variance only'}

3. Notable Translations:
   - Collection types mapped appropriately
   - Method syntax adapted to target language idioms
   - String interpolation converted where supported
   
4. Edge Cases Requiring Manual Review:
   - Async/await patterns (if present)
   - Exception handling differences
   - Operator overloading semantics`;
            } else {
                document.getElementById('output-0').textContent = `// Transpiler not implemented for ${source} -> ${target}`;
            }
        }
        
        function switchTab(index, tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            
            document.querySelectorAll('[id^="output-"]').forEach(o => o.style.display = 'none');
            document.getElementById(`output-${index}`).style.display = 'block';
        }
        
        // Update source label when language changes
        document.getElementById('sourceLang').addEventListener('change', (e) => {
            document.getElementById('sourceLabel').textContent = 
                e.target.value.charAt(0).toUpperCase() + e.target.value.slice(1);
        });
        
        // Auto-adjust target when source changes to avoid same language
        document.getElementById('sourceLang').addEventListener('change', (e) => {
            const target = document.getElementById('targetLang');
            if (e.target.value === target.value) {
                // Switch to next available option
                const options = ['typescript', 'kotlin', 'cppfront'].filter(o => o !== e.target.value);
                target.value = options[0];
            }
        });
    </script>
</body>
</html>
