<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moneyfan WASM Test</title>
    <style>
        body { font-family: monospace; white-space: pre; }
    </style>
</head>
<body>
    <h1>Moneyfan WASM Output</h1>
    <div id="output">Loading WASM module...</div>
    <script type="module">
        // Adjust the path to the .js file based on Gradle output
        // It's typically named after the project, e.g., moneyfan.js
        // The wasmJsBrowserDistribution task should put it in a known location.
        // Let's assume the output of wasmJsBrowserDistribution is in 'build/dist/wasmJs/productionExecutable/'
        // and we will manually copy 'moneyfan.js' and 'moneyfan.wasm' to the 'web' directory.

        // For now, let's assume the script is co-located or its path is known.
        // The Kotlin/WASM compiler generates a .js file that loads the .wasm file.
        // This .js file should be in the same directory as index.html after the build,
        // or the path needs to be adjusted.

        // Path if files are copied to 'web/' directory:
        import { generateChartForSampleData, greet } from './moneyfan.js';

        async function main() {
            const outputDiv = document.getElementById('output');
            try {
                const greeting = greet();
                const chartOutput = generateChartForSampleData();
                outputDiv.textContent = greeting + "\n\n" + chartOutput;
            } catch (e) {
                outputDiv.textContent = "Error loading or running WASM module: " + e;
                console.error(e);
            }
        }
        main();
    </script>
</body>
</html>
